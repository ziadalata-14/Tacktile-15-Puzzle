<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VAULT CIPHER — Tactile 15-Puzzle (WebXR)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      overflow: hidden;
      background: #07090d;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      touch-action: none;
    }

    /* --- Cinematic Intro Overlay --- */
    #intro-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: radial-gradient(circle at center, rgba(7, 9, 13, 0.22) 0%, rgba(5, 7, 11, 0.72) 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .intro-card {
      width: min(92vw, 520px);
      background: linear-gradient(160deg, rgba(16, 20, 28, 0.86), rgba(9, 12, 18, 0.92));
      border: 1.5px solid rgba(212, 168, 83, 0.55);
      border-radius: 18px;
      padding: 28px 26px 24px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 232, 179, 0.22);
      position: relative;
      overflow: hidden;
    }
    .intro-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(212, 168, 83, 0.1) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: cardSheen 6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes cardSheen {
      0%, 60% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #d4a853;
      opacity: 0.92;
      margin-bottom: 6px;
    }
    .intro-title {
      font-size: clamp(30px, 6vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #fff4d2 0%, #d4a853 52%, #8a6424 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(212, 168, 83, 0.25));
      line-height: 1.08;
    }
    .intro-sub {
      font-size: 12px;
      letter-spacing: 5px;
      color: #94a3b8;
      margin-top: 6px;
      margin-bottom: 20px;
    }
    .cfg-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #64748b;
      margin: 12px 0 7px;
      text-transform: uppercase;
    }
    .pill-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .pill-btn {
      background: rgba(20, 26, 36, 0.85);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .pill-btn:hover { border-color: rgba(212, 168, 83, 0.65); color: #f8fafc; }
    .pill-btn.active {
      background: rgba(212, 168, 83, 0.18);
      border-color: #d4a853;
      color: #fef3c7;
      box-shadow: 0 0 14px rgba(212, 168, 83, 0.22);
    }
    .launch-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 22px;
    }
    .launch-btn {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.4px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s, background 0.15s;
      border: 1.5px solid rgba(212, 168, 83, 0.65);
      background: rgba(30, 36, 48, 0.9);
      color: #f8fafc;
    }
    .launch-btn.primary {
      background: linear-gradient(180deg, rgba(212, 168, 83, 0.35), rgba(146, 102, 34, 0.38));
      border-color: #e6be6c;
      color: #fffbeb;
      box-shadow: 0 0 22px rgba(212, 168, 83, 0.25);
    }
    .launch-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 168, 83, 0.3);
    }
    .launch-btn:active:not(:disabled) { transform: scale(0.98); }
    .launch-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      border-color: rgba(148, 163, 184, 0.25);
      box-shadow: none;
    }
    .launch-xr-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    /* --- In-Game Top HUD --- */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #hud.visible { opacity: 1; }

      flex-wrap: wrap;
