<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VAULT CIPHER — Tactile 15-Puzzle (WebXR)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      overflow: hidden;
      background: #07090d;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      touch-action: none;
    }

    /* --- Cinematic Intro Overlay --- */
    #intro-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: radial-gradient(circle at center, rgba(7, 9, 13, 0.22) 0%, rgba(5, 7, 11, 0.72) 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .intro-card {
      width: min(92vw, 520px);
      background: linear-gradient(160deg, rgba(16, 20, 28, 0.86), rgba(9, 12, 18, 0.92));
      border: 1.5px solid rgba(212, 168, 83, 0.55);
      border-radius: 18px;
      padding: 28px 26px 24px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 232, 179, 0.22);
      position: relative;
      overflow: hidden;
    }
    .intro-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(212, 168, 83, 0.1) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: cardSheen 6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes cardSheen {
      0%, 60% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #d4a853;
      opacity: 0.92;
      margin-bottom: 6px;
    }
    .intro-title {
      font-size: clamp(30px, 6vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #fff4d2 0%, #d4a853 52%, #8a6424 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(212, 168, 83, 0.25));
      line-height: 1.08;
    }
    .intro-sub {
      font-size: 12px;
      letter-spacing: 5px;
      color: #94a3b8;
      margin-top: 6px;
      margin-bottom: 20px;
    }
    .cfg-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #64748b;
      margin: 12px 0 7px;
      text-transform: uppercase;
    }
    .pill-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .pill-btn {
      background: rgba(20, 26, 36, 0.85);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .pill-btn:hover { border-color: rgba(212, 168, 83, 0.65); color: #f8fafc; }
    .pill-btn.active {
      background: rgba(212, 168, 83, 0.18);
      border-color: #d4a853;
      color: #fef3c7;
      box-shadow: 0 0 14px rgba(212, 168, 83, 0.22);
    }
    .launch-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 22px;
    }
    .launch-btn {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.4px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s, background 0.15s;
      border: 1.5px solid rgba(212, 168, 83, 0.65);
      background: rgba(30, 36, 48, 0.9);
      color: #f8fafc;
    }
    .launch-btn.primary {
      background: linear-gradient(180deg, rgba(212, 168, 83, 0.35), rgba(146, 102, 34, 0.38));
      border-color: #e6be6c;
      color: #fffbeb;
      box-shadow: 0 0 22px rgba(212, 168, 83, 0.25);
    }
    .launch-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 168, 83, 0.3);
    }
    .launch-btn:active:not(:disabled) { transform: scale(0.98); }
    .launch-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      border-color: rgba(148, 163, 184, 0.25);
      box-shadow: none;
    }
    .launch-xr-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    /* --- In-Game Top HUD --- */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #hud.visible { opacity: 1; }
    .hud-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(11, 15, 22, 0.78);
      border: 1px solid rgba(212, 168, 83, 0.35);
      border-radius: 10px;
      padding: 6px 10px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
      align-items: center;
    }
    .hud-stat {
      font-size: 12px;
      color: #94a3b8;
      padding: 0 6px;
    }
    .hud-stat b { color: #fef3c7; font-variant-numeric: tabular-nums; }
    .hud-btn {
      background: rgba(30, 38, 52, 0.9);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      cursor: pointer;
    }
    .hud-btn:hover { border-color: #d4a853; color: #fff; }
    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.4px;
      color: #94a3b8;
      background: rgba(11, 15, 22, 0.74);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 6px 14px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }
    #hint.visible { opacity: 1; }

    /* --- Solved Toast --- */
    #solved-toast {
      position: fixed;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(12, 18, 26, 0.92);
      border: 1.5px solid #22c55e;
      border-radius: 12px;
      padding: 12px 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    #solved-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #solved-toast h3 { color: #4ade80; font-size: 16px; letter-spacing: 2px; }
    #solved-toast p { color: #cbd5e1; font-size: 12px; margin-top: 3px; }
  </style>
</head>
<body>

  <!-- Cinematic Intro -->
  <div id="intro-overlay">
    <div class="intro-card">
      <div class="brand-tag">ZEE GAMES PRESENTS</div>
      <div class="intro-title">VAULT CIPHER</div>
      <div class="intro-sub">TACTILE 15-PUZZLE</div>

      <div class="cfg-label">Material Theme</div>
      <div class="pill-row">
        <button class="pill-btn active" data-theme="vault">VAULT CIPHER</button>
        <button class="pill-btn" data-theme="wood">HEIRLOOM WOOD</button>
      </div>

      <div class="cfg-label">Grid Size</div>
      <div class="pill-row">
        <button class="pill-btn" data-size="3">3×3</button>
        <button class="pill-btn active" data-size="4">4×4</button>
        <button class="pill-btn" data-size="5">5×5</button>
        <button class="pill-btn" data-size="6">6×6</button>
      </div>

      <div class="launch-row">
        <button id="btn-play-desktop" class="launch-btn primary">PLAY ON DESKTOP</button>
        <div class="launch-xr-split">
          <button id="btn-enter-mr" class="launch-btn" disabled>MIXED REALITY</button>
          <button id="btn-enter-vr" class="launch-btn" disabled>ENTER VR</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Compact In-Game HUD -->
  <div id="hud">
    <div class="hud-group">
      <span class="hud-stat">MOVES <b id="hud-moves">0</b></span>
      <span class="hud-stat">TIME <b id="hud-time">00:00</b></span>
      <span class="hud-stat">BEST <b id="hud-best">--:--</b></span>
    </div>
    <div class="hud-group">
      <button class="hud-btn" id="hud-intro">Intro</button>
      <button class="hud-btn" id="hud-shuffle">Shuffle</button>
      <button class="hud-btn" id="hud-size">4×4</button>
      <button class="hud-btn" id="hud-theme">Vault</button>
      <button class="hud-btn" id="hud-tilt">Tilt</button>
      <button class="hud-btn" id="hud-mute">Sound: ON</button>
    </div>
  </div>

  <div id="solved-toast">
    <h3>CIPHER UNLOCKED</h3>
    <p id="solved-detail">Solved in 0 moves</p>
  </div>

  <div id="hint">Click tile or use Arrow/WASD keys • Right-drag to orbit • VR/MR: Poke, Pinch-Ray, or Pinch/Grip bezel to move</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================================
    // 1. SYNTHESIZED WEB AUDIO (Theme-aware mechanical & wood sounds)
    // =========================================================================
    let audioCtx = null;
    let muted = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, dur, type = 'sine', vol = 0.12, slideTo = null, delay = 0) {
      if (muted) return;
      initAudio();
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function playSlideSound(theme, count = 1) {
      if (muted) return;
      initAudio();
      const mult = Math.min(1.4, 0.9 + count * 0.15);
      if (theme === 'vault') {
        // Metallic rail glide + crisp detent click
        playTone(220, 0.07, 'triangle', 0.08 * mult, 140);
        playTone(1250 + Math.random() * 220, 0.045, 'square', 0.055, 620, 0.055);
      } else {
        // Warm hollow mahogany clack
        playTone(310 + Math.random() * 40, 0.055, 'sine', 0.14 * mult, 150);
        playTone(540 + Math.random() * 60, 0.035, 'triangle', 0.09, 260, 0.045);
      }
    }

    function playButtonSound(theme) {
      if (theme === 'vault') {
        playTone(880, 0.04, 'square', 0.06, 420);
      } else {
        playTone(460, 0.05, 'triangle', 0.1, 280);
      }
    }

    function playBootSound() {
      if (muted) return;
      initAudio();
      // Low servo hum + 3 mechanical tumbler clicks
      playTone(68, 0.65, 'sawtooth', 0.05, 118);
      [0.12, 0.26, 0.42].forEach((d, i) => {
        playTone(720 + i * 190, 0.04, 'square', 0.05, 340, d);
      });
    }

    function playSolveChime() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        playTone(f, 0.35, 'triangle', 0.12, null, i * 0.09);
      });
    }

    // =========================================================================
    // 2. THREE.JS SCENE, LIGHTING & STUDIO ENVIRONMENT
    // =========================================================================
    const scene = new THREE.Scene();
    const bgVault = new THREE.Color(0x07090d);
    const bgWood = new THREE.Color(0x120d0a);
    scene.background = bgVault;
    scene.fog = new THREE.FogExp2(0x07090d, 0.09);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.03, 40);
    camera.position.set(0, 1.38, 0.86);
    camera.lookAt(0, 1.25, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.9);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff5e4, 1.75);
    keyLight.position.set(1.6, 2.8, 2.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x60a5fa, 1.8, 8);
    rimLight.position.set(-1.6, 1.8, -1.2);
    scene.add(rimLight);

    const brassLight = new THREE.PointLight(0xd4a853, 1.4, 6);
    brassLight.position.set(1.2, 0.9, 1.2);
    scene.add(brassLight);

    // Subtle Studio Backdrop (Auto-hidden in Mixed Reality)
    const envGroup = new THREE.Group();
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 18),
      new THREE.MeshStandardMaterial({ color: 0x0b0e14, roughness: 0.88, metalness: 0.15 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    envGroup.add(floor);

    const grid = new THREE.GridHelper(18, 36, 0x334155, 0x141923);
    grid.position.y = 0.003;
    envGroup.add(grid);
    scene.add(envGroup);

    // =========================================================================
    // 3. PROCEDURAL TEXTURES (Mahogany Wood Grain, Brushed Metal, Tiles, Bezel)
    // =========================================================================
    function createWoodTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3b1d12';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 180; i++) {
        const y = Math.random() * 512;
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(26, 10, 5, 0.35)' : 'rgba(92, 46, 26, 0.25)';
        ctx.lineWidth = 1 + Math.random() * 3.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(170, y + (Math.random() - 0.5) * 18, 340, y + (Math.random() - 0.5) * 18, 512, y);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createBrushedMetalTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#252a33';
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y++) {
        const v = 32 + Math.floor(Math.random() * 14);
        ctx.fillStyle = `rgb(${v}, ${v + 4}, ${v + 10})`;
        ctx.fillRect(0, y, 256, 1);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const woodTex = createWoodTexture();
    const metalTex = createBrushedMetalTexture();

    function createTileFaceTexture(num, theme, gridSize) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');

      if (theme === 'vault') {
        const grad = ctx.createLinearGradient(0, 0, 256, 256);
        grad.addColorStop(0, '#1e232c');
        grad.addColorStop(1, '#11141a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 256);

        // Recessed inner border
        ctx.strokeStyle = 'rgba(212, 168, 83, 0.35)';
        ctx.lineWidth = 6;
        ctx.strokeRect(16, 16, 224, 224);

        // Engraved brushed brass numeral
        const fontSize = gridSize >= 6 ? 112 : gridSize === 5 ? 124 : 138;
        ctx.font = `800 ${fontSize}px "Segoe UI", system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillText(String(num), 130, 136);

        const numGrad = ctx.createLinearGradient(0, 60, 0, 200);
        numGrad.addColorStop(0, '#fae3a7');
        numGrad.addColorStop(0.5, '#d4a853');
        numGrad.addColorStop(1, '#8c6626');
        ctx.fillStyle = numGrad;
        ctx.fillText(String(num), 128, 132);
      } else {
        // Warm Ivory tile
        const grad = ctx.createLinearGradient(0, 0, 256, 256);
        grad.addColorStop(0, '#fbf5e6');
        grad.addColorStop(1, '#e8dcc0');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 256);

        ctx.strokeStyle = 'rgba(138, 100, 36, 0.32)';
        ctx.lineWidth = 5;
        ctx.strokeRect(16, 16, 224, 224);

        const fontSize = gridSize >= 6 ? 114 : gridSize === 5 ? 126 : 142;
        ctx.font = `700 ${fontSize}px Georgia, "Times New Roman", serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#2d180e';
        ctx.fillText(String(num), 128, 134);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4;
      return tex;
    }

    function makeRoundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const hw = w / 2, hh = h / 2;
      s.moveTo(-hw + r, -hh);
      s.lineTo(hw - r, -hh);
      s.quadraticCurveTo(hw, -hh, hw, -hh + r);
      s.lineTo(hw, hh - r);
      s.quadraticCurveTo(hw, hh, hw - r, hh);
      s.lineTo(-hw + r, hh);
      s.quadraticCurveTo(-hw, hh, -hw, hh - r);
      s.lineTo(-hw, -hh + r);
      s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
      return s;
    }

    // =========================================================================
    // 4. PUZZLE STATE & 3D ARTIFACT RIG
    // =========================================================================
    const BOARD_INNER = 0.40;
    const FRAME_W = 0.50;
    const FRAME_H = 0.56;
    const FRAME_D = 0.042;
    const GRID_Y_OFFSET = -0.025;
    const TILT_PRESETS = [
      { label: '5°',  rad: -THREE.MathUtils.degToRad(5) },
      { label: '35°', rad: -THREE.MathUtils.degToRad(35) },
      { label: '65°', rad: -THREE.MathUtils.degToRad(65) }
    ];

    let appState = 'intro'; // 'intro' | 'booting' | 'playing'
    let currentTheme = 'vault';
    let gridSize = 4;
    let tiltIdx = 0;
    let moves = 0;
    let timerSec = 0;
    let timerRunning = false;
    let isSolved = false;

    let board = [];       // 1D array of length N*N, 0 = empty
    let tileMeshes = {};  // value -> { group, pipMat, currentPos, targetPos }
    let interactiveTiles = [];
    let sideButtons = [];

    const boardRig = new THREE.Group();
    boardRig.position.set(0, 1.24, -0.05);
    scene.add(boardRig);

    const frameGroup = new THREE.Group();
    const tilesGroup = new THREE.Group();
    const sideBtnGroup = new THREE.Group();
    boardRig.add(frameGroup, tilesGroup, sideBtnGroup);

    // Diegetic 3D Bezel Display Canvas
    const bezelCanvas = document.createElement('canvas');
    bezelCanvas.width = 768; bezelCanvas.height = 128;
    const bezelCtx = bezelCanvas.getContext('2d');
    const bezelTex = new THREE.CanvasTexture(bezelCanvas);
    let bezelMesh = null;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function getBestKey() { return `vault_cipher_best_${gridSize}`; }
    function getBestTime() {
      const v = localStorage.getItem(getBestKey());
      return v ? parseFloat(v) : null;
    }

    function updateDisplays(customStatus = null) {
      const best = getBestTime();
      const timeStr = formatTime(timerSec);
      const bestStr = best !== null ? formatTime(best) : '--:--';

      document.getElementById('hud-moves').textContent = moves;
      document.getElementById('hud-time').textContent = timeStr;
      document.getElementById('hud-best').textContent = bestStr;
      document.getElementById('hud-size').textContent = `${gridSize}×${gridSize}`;
      document.getElementById('hud-theme').textContent = currentTheme === 'vault' ? 'Vault' : 'Wood';

      // Draw 3D Bezel Readout
      const ctx = bezelCtx;
      ctx.clearRect(0, 0, 768, 128);
      ctx.fillStyle = currentTheme === 'vault' ? '#090c11' : '#1b0f09';
      ctx.fillRect(0, 0, 768, 128);

      ctx.strokeStyle = currentTheme === 'vault' ? '#d4a853' : '#c89d4e';
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 760, 120);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (customStatus) {
        ctx.fillStyle = '#4ade80';
        ctx.font = '800 42px "Segoe UI", sans-serif';
        ctx.fillText(customStatus, 384, 66);
      } else {
        ctx.fillStyle = currentTheme === 'vault' ? '#f5d790' : '#f7e5bc';
        ctx.font = '700 34px "Segoe UI", monospace';
        ctx.fillText(`MOVES: ${String(moves).padStart(3, '0')}   •   TIME: ${timeStr}   •   BEST: ${bestStr}`, 384, 66);
      }
      bezelTex.needsUpdate = true;
    }

    function buildFrame() {
      frameGroup.clear();
      sideBtnGroup.clear();
      sideButtons = [];

      const isVault = currentTheme === 'vault';
      const housingMat = new THREE.MeshStandardMaterial({
        color: isVault ? 0x2a303b : 0x5c2e18,
        map: isVault ? metalTex : woodTex,
        roughness: isVault ? 0.38 : 0.55,
        metalness: isVault ? 0.72 : 0.08
      });
      const trimMat = new THREE.MeshStandardMaterial({
        color: 0xd4a853,
        roughness: 0.28,
        metalness: 0.85
      });
      const wellMat = new THREE.MeshStandardMaterial({
        color: isVault ? 0x0c0f15 : 0x1d0e07,
        roughness: 0.85,
        metalness: isVault ? 0.3 : 0.05
      });

      // Outer beveled chassis
      const chassisShape = makeRoundedRectShape(FRAME_W, FRAME_H, 0.026);
      const chassisGeo = new THREE.ExtrudeGeometry(chassisShape, {
        depth: FRAME_D,
        bevelEnabled: true,
        bevelThickness: 0.008,
        bevelSize: 0.008,
        bevelSegments: 3
      });
      chassisGeo.translate(0, 0, -FRAME_D / 2);
      const chassis = new THREE.Mesh(chassisGeo, housingMat);
      chassis.castShadow = true;
      chassis.receiveShadow = true;
      chassis.userData.isBezel = true;
      frameGroup.add(chassis);

      // Recessed dark well behind tiles
      const well = new THREE.Mesh(
        new THREE.BoxGeometry(BOARD_INNER + 0.012, BOARD_INNER + 0.012, 0.01),
        wellMat
      );
      well.position.set(0, GRID_Y_OFFSET, FRAME_D / 2 + 0.004);
      well.receiveShadow = true;
      frameGroup.add(well);

      // Brass inner trim around tile well
      const trimSize = BOARD_INNER + 0.022;
      const trimBar = 0.007;
      [
        [0, GRID_Y_OFFSET + trimSize / 2, trimSize, trimBar],
        [0, GRID_Y_OFFSET - trimSize / 2, trimSize, trimBar],
        [-trimSize / 2, GRID_Y_OFFSET, trimBar, trimSize],
        [trimSize / 2, GRID_Y_OFFSET, trimBar, trimSize]
      ].forEach(([x, y, w, h]) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.006), trimMat);
        m.position.set(x, y, FRAME_D / 2 + 0.009);
        frameGroup.add(m);
      });

      // Corner Details: Hex Bolts (Vault) or Brass Corner Plates (Wood)
      const cx = FRAME_W / 2 - 0.028;
      const cy = FRAME_H / 2 - 0.028;
      [[-cx, cy], [cx, cy], [-cx, -cy], [cx, -cy]].forEach(([x, y]) => {
        if (isVault) {
          const bolt = new THREE.Mesh(
            new THREE.CylinderGeometry(0.013, 0.013, 0.01, 6),
            new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.3, metalness: 0.85 })
          );
          bolt.rotation.x = Math.PI / 2;
          bolt.position.set(x, y, FRAME_D / 2 + 0.009);
          frameGroup.add(bolt);
        } else {
          const stud = new THREE.Mesh(new THREE.SphereGeometry(0.009, 12, 12), trimMat);
          stud.scale.set(1, 1, 0.5);
          stud.position.set(x, y, FRAME_D / 2 + 0.009);
          frameGroup.add(stud);
        }
      });

      // Diegetic 3D Bezel Display at Top
      bezelMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.35, 0.052),
        new THREE.MeshBasicMaterial({ map: bezelTex })
      );
      bezelMesh.position.set(0, FRAME_H / 2 - 0.044, FRAME_D / 2 + 0.011);
      frameGroup.add(bezelMesh);

      // 4 Physical Spring-Loaded Side Buttons on Right Edge
      const btnDefs = [
        { label: 'SHUFFLE', action: () => startNewShuffle(true) },
        { label: 'SIZE',    action: () => cycleGridSize() },
        { label: 'THEME',   action: () => toggleTheme() },
        { label: 'TILT',    action: () => cycleTilt() }
      ];
      btnDefs.forEach((def, idx) => {
        const y = 0.12 - idx * 0.095;
        const g = new THREE.Group();
        g.position.set(FRAME_W / 2 + 0.014, y, 0.006);

        const cap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.016, 0.018, 0.022, 16),
          trimMat
        );
        cap.rotation.z = -Math.PI / 2;
        cap.userData.sideBtnIdx = idx;
        g.add(cap);

        // Mini label beside button
        const lc = document.createElement('canvas');
        lc.width = 160; lc.height = 48;
        const lctx = lc.getContext('2d');
        lctx.fillStyle = isVault ? '#d4a853' : '#f3d89c';
        lctx.font = '800 24px "Segoe UI", sans-serif';
        lctx.textAlign = 'left';
        lctx.textBaseline = 'middle';
        lctx.fillText(def.label, 6, 24);
        const lMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(0.068, 0.02),
          new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(lc), transparent: true })
        );
        lMesh.position.set(0.045, 0, 0.012);
        g.add(lMesh);

        sideBtnGroup.add(g);
        sideButtons.push({ group: g, cap, action: def.action, pressAnim: 0, cooldown: 0 });
      });
    }

    function cellToLocalPos(index) {
      const r = Math.floor(index / gridSize);
      const c = index % gridSize;
      const cell = BOARD_INNER / gridSize;
      const x = -BOARD_INNER / 2 + cell * (c + 0.5);
      const y = GRID_Y_OFFSET + BOARD_INNER / 2 - cell * (r + 0.5);
      return new THREE.Vector3(x, y, FRAME_D / 2 + 0.014);
    }

    function buildTiles(preserveBoard = false) {
      tilesGroup.clear();
      tileMeshes = {};
      interactiveTiles = [];

      const total = gridSize * gridSize;
      if (!preserveBoard || board.length !== total) {
        board = [];
        for (let i = 1; i < total; i++) board.push(i);
        board.push(0);
      }

      const cell = BOARD_INNER / gridSize;
      const gap = Math.max(0.004, cell * 0.07);
      const tileSize = cell - gap;
      const bevel = Math.min(0.005, tileSize * 0.06);
      const tileDepth = 0.016;

      const shape = makeRoundedRectShape(tileSize - bevel * 2, tileSize - bevel * 2, bevel * 1.4);
      const bodyGeo = new THREE.ExtrudeGeometry(shape, {
        depth: tileDepth,
        bevelEnabled: true,
        bevelThickness: bevel,
        bevelSize: bevel,
        bevelSegments: 2
      });
      bodyGeo.translate(0, 0, -tileDepth / 2);

      const isVault = currentTheme === 'vault';
      const bodyMat = new THREE.MeshStandardMaterial({
        color: isVault ? 0x161a22 : 0xe9ddc2,
        roughness: isVault ? 0.32 : 0.42,
        metalness: isVault ? 0.65 : 0.05
      });

      const faceGeo = new THREE.PlaneGeometry(tileSize * 0.84, tileSize * 0.84);
      const pipGeo = new THREE.SphereGeometry(Math.max(0.0028, tileSize * 0.042), 10, 10);

      for (let i = 0; i < total; i++) {
        const val = board[i];
        if (val === 0) continue;

        const g = new THREE.Group();
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        body.userData.tileValue = val;
        g.add(body);

        const faceMat = new THREE.MeshStandardMaterial({
          map: createTileFaceTexture(val, currentTheme, gridSize),
          roughness: isVault ? 0.38 : 0.45,
          metalness: isVault ? 0.35 : 0.04
        });
        const face = new THREE.Mesh(faceGeo, faceMat);
        face.position.z = tileDepth / 2 + bevel + 0.0008;
        face.userData.tileValue = val;
        g.add(face);

        // Recessed home-position LED pip in top-right corner of tile
        const pipMat = new THREE.MeshBasicMaterial({ color: 0x334155 });
        const pip = new THREE.Mesh(pipGeo, pipMat);
        pip.position.set(tileSize * 0.33, tileSize * 0.33, tileDepth / 2 + bevel + 0.0012);
        g.add(pip);

        const pos = cellToLocalPos(i);
        g.position.copy(pos);
        tilesGroup.add(g);

        tileMeshes[val] = {
          group: g,
          pipMat,
          targetPos: pos.clone(),
          sweepGlow: 0
        };
        interactiveTiles.push(body, face);
      }

      refreshPipStates();
      updateDisplays();
    }

    function refreshPipStates() {
      const total = gridSize * gridSize;
      for (let i = 0; i < total; i++) {
        const val = board[i];
        if (val === 0) continue;
        const tm = tileMeshes[val];
        if (!tm) continue;
        const inHome = (val === i + 1);
        tm.inHome = inHome;
        if (tm.sweepGlow <= 0) {
          tm.pipMat.color.setHex(inHome ? 0x22c55e : (currentTheme === 'vault' ? 0x5c4318 : 0x8b6b4a));
        }
      }
    }

    // =========================================================================
    // 5. GUARANTEED-SOLVABLE SHUFFLE & MULTI-TILE SLIDING
    // =========================================================================
    function startNewShuffle(withSound = false) {
      const total = gridSize * gridSize;
      board = [];
      for (let i = 1; i < total; i++) board.push(i);
      board.push(0);

      let emptyIdx = total - 1;
      let prevIdx = -1;
      const steps = gridSize * gridSize * 14;

      for (let s = 0; s < steps; s++) {
        const r = Math.floor(emptyIdx / gridSize);
        const c = emptyIdx % gridSize;
        const neighbors = [];
        if (r > 0) neighbors.push(emptyIdx - gridSize);
        if (r < gridSize - 1) neighbors.push(emptyIdx + gridSize);
        if (c > 0) neighbors.push(emptyIdx - 1);
        if (c < gridSize - 1) neighbors.push(emptyIdx + 1);

        const valid = neighbors.filter(n => n !== prevIdx);
        const pick = valid[Math.floor(Math.random() * valid.length)];
        board[emptyIdx] = board[pick];
        board[pick] = 0;
        prevIdx = emptyIdx;
        emptyIdx = pick;
      }

      moves = 0;
      timerSec = 0;
      timerRunning = false;
      isSolved = false;
      document.getElementById('solved-toast').classList.remove('show');

      for (let i = 0; i < total; i++) {
        const val = board[i];
        if (val !== 0 && tileMeshes[val]) {
          tileMeshes[val].targetPos.copy(cellToLocalPos(i));
        }
      }
      refreshPipStates();
      updateDisplays();
      if (withSound) playSlideSound(currentTheme, 2);
    }

    function trySlideTile(val, isDemo = false) {
      if (!isDemo && (appState !== 'playing' || isSolved)) return false;
      const tileIdx = board.indexOf(val);
      const emptyIdx = board.indexOf(0);
      if (tileIdx === -1 || emptyIdx === -1) return false;

      const tr = Math.floor(tileIdx / gridSize), tc = tileIdx % gridSize;
      const er = Math.floor(emptyIdx / gridSize), ec = emptyIdx % gridSize;
      if (tr !== er && tc !== ec) return false;

      // Multi-tile line slide toward empty slot
      const dr = Math.sign(tr - er);
      const dc = Math.sign(tc - ec);
      let curR = er, curC = ec;
      let slidCount = 0;

      while (curR !== tr || curC !== tc) {
        const nextR = curR + dr;
        const nextC = curC + dc;
        const curIdx = curR * gridSize + curC;
        const nextIdx = nextR * gridSize + nextC;
        board[curIdx] = board[nextIdx];
        const movedVal = board[curIdx];
        if (tileMeshes[movedVal]) {
          tileMeshes[movedVal].targetPos.copy(cellToLocalPos(curIdx));
        }
        curR = nextR;
        curC = nextC;
        slidCount++;
      }
      board[tileIdx] = 0;

      if (!isDemo) {
        if (!timerRunning) timerRunning = true;
        moves++;
        playSlideSound(currentTheme, slidCount);
        refreshPipStates();
        checkSolved();
        updateDisplays(isSolved ? 'CIPHER UNLOCKED' : null);
      }
      return true;
    }

    function checkSolved() {
      const total = gridSize * gridSize;
      for (let i = 0; i < total - 1; i++) {
        if (board[i] !== i + 1) return;
      }
      isSolved = true;
      timerRunning = false;
      playSolveChime();

      const prevBest = getBestTime();
      if (prevBest === null || timerSec < prevBest) {
        localStorage.setItem(getBestKey(), String(timerSec));
      }
      // Celebrate with LED sweep
      Object.values(tileMeshes).forEach((tm, idx) => {
        setTimeout(() => { tm.sweepGlow = 0.55; }, idx * 25);
      });

      document.getElementById('solved-detail').textContent = `Solved ${gridSize}×${gridSize} in ${moves} moves (${formatTime(timerSec)})`;
      document.getElementById('solved-toast').classList.add('show');
    }

    // =========================================================================
    // 6. THEME, SIZE, TILT & BOOT-UP SEQUENCE
    // =========================================================================
    function applyTheme(theme) {
      currentTheme = theme;
      const isVault = theme === 'vault';
      if (!renderer.xr.isPresenting) {
        scene.background = isVault ? bgVault : bgWood;
        scene.fog = new THREE.FogExp2(isVault ? 0x07090d : 0x120d0a, 0.09);
      }
      document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
      buildFrame();
      buildTiles(true);
    }

    function toggleTheme() {
      playButtonSound(currentTheme);
      applyTheme(currentTheme === 'vault' ? 'wood' : 'vault');
    }

    function setGridSize(n) {
      gridSize = n;
      document.querySelectorAll('[data-size]').forEach(b => b.classList.toggle('active', Number(b.dataset.size) === n));
      buildTiles(false);
      if (appState === 'playing') startNewShuffle(true);
    }

    function cycleGridSize() {
      playButtonSound(currentTheme);
      const next = gridSize >= 6 ? 3 : gridSize + 1;
      setGridSize(next);
    }

    function cycleTilt() {
      playButtonSound(currentTheme);
      tiltIdx = (tiltIdx + 1) % TILT_PRESETS.length;
    }

    function triggerBootSequence(xrMode = null) {
      initAudio();
      playBootSound();
      document.getElementById('intro-overlay').classList.add('hidden');
      appState = 'booting';

      if (xrMode) startXR(xrMode);

      // LED diagnostic sweep across all tiles
      const vals = Object.keys(tileMeshes).map(Number).sort((a, b) => a - b);
      vals.forEach((v, idx) => {
        setTimeout(() => {
          if (tileMeshes[v]) tileMeshes[v].sweepGlow = 0.4;
        }, idx * 28);
      });

      setTimeout(() => {
        appState = 'playing';
        startNewShuffle(true);
        if (!renderer.xr.isPresenting) {
          document.getElementById('hud').classList.add('visible');
          document.getElementById('hint').classList.add('visible');
        }
      }, 720);
    }

    function returnToIntro() {
      appState = 'intro';
      timerRunning = false;
      document.getElementById('hud').classList.remove('visible');
      document.getElementById('hint').classList.remove('visible');
      document.getElementById('solved-toast').classList.remove('show');
      document.getElementById('intro-overlay').classList.remove('hidden');
    }

    // =========================================================================
    // 7. DESKTOP / MOBILE CONTROLS (Click, Right-Drag Orbit, Arrow/WASD)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let isOrbiting = false;
    let lastOrbit = { x: 0, y: 0 };
    let orbitYaw = 0, orbitPitch = 0.12;

    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting || appState !== 'playing') return;
      initAudio();
      if (e.button === 2) {
        isOrbiting = true;
        lastOrbit = { x: e.clientX, y: e.clientY };
        return;
      }
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const tileHits = raycaster.intersectObjects(interactiveTiles, false);
      if (tileHits.length > 0) {
        trySlideTile(tileHits[0].object.userData.tileValue);
        return;
      }
      const btnCaps = sideButtons.map(b => b.cap);
      const btnHits = raycaster.intersectObjects(btnCaps, false);
      if (btnHits.length > 0) {
        const b = sideButtons[btnHits[0].object.userData.sideBtnIdx];
        b.pressAnim = 1.0;
        b.action();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isOrbiting) return;
      orbitYaw -= (e.clientX - lastOrbit.x) * 0.006;
      orbitPitch = THREE.MathUtils.clamp(orbitPitch + (e.clientY - lastOrbit.y) * 0.006, -0.55, 0.85);
      lastOrbit = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointerup', () => { isOrbiting = false; });

    window.addEventListener('keydown', (e) => {
      if (appState !== 'playing' || isSolved) return;
      const emptyIdx = board.indexOf(0);
      const er = Math.floor(emptyIdx / gridSize), ec = emptyIdx % gridSize;
      let tr = er, tc = ec;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') tr = er + 1;
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') tr = er - 1;
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') tc = ec + 1;
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') tc = ec - 1;
      else return;
      if (tr >= 0 && tr < gridSize && tc >= 0 && tc < gridSize) {
        trySlideTile(board[tr * gridSize + tc]);
      }
    });

    // =========================================================================
    // 8. WEBXR: QUEST 3 MIXED REALITY + CONTROLLERS + NATIVE HAND TRACKING
    // =========================================================================
    function pulseHaptic(source, strength = 0.5, ms = 35) {
      const gp = source && source.gamepad;
      if (gp && gp.hapticActuators && gp.hapticActuators[0]) {
        gp.hapticActuators[0].pulse(strength, ms);
      }
    }

    // Grab / Reposition State (shared by controller grip & hand pinch)
    let grabState = { active: false, grabber: null, offsetMatrix: new THREE.Matrix4() };
    function beginGrab(grabberObj) {
      grabState.active = true;
      grabState.grabber = grabberObj;
      const invGrab = new THREE.Matrix4().copy(grabberObj.matrixWorld).invert();
      grabState.offsetMatrix.multiplyMatrices(invGrab, boardRig.matrixWorld);
    }
    function endGrab(grabberObj) {
      if (grabState.active && grabState.grabber === grabberObj) {
        grabState.active = false;
        grabState.grabber = null;
      }
    }

    // --- Touch Plus Controllers (Pointer Ray + Direct Poke Stylus + Grip Move) ---
    const xrRayMat = new THREE.LineBasicMaterial({ color: 0xd4a853, transparent: true, opacity: 0.55 });
    const xrControllers = [0, 1].map((i) => {
      const ctrl = renderer.xr.getController(i);
      const stylus = new THREE.Mesh(
        new THREE.CylinderGeometry(0.003, 0.006, 0.08, 12),
        new THREE.MeshStandardMaterial({ color: 0xd4a853, metalness: 0.8, roughness: 0.25 })
      );
      stylus.rotation.x = Math.PI / 2;
      stylus.position.z = -0.04;
      ctrl.add(stylus);

      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.0055, 10, 10),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      tip.position.z = -0.082;
      ctrl.add(tip);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2.5)]);
      const rayLine = new THREE.Line(lineGeo, xrRayMat);
      ctrl.add(rayLine);
      scene.add(ctrl);

      const state = { ctrl, tip, source: null, pokeCooldown: 0 };
      ctrl.addEventListener('connected', e => { state.source = e.data; });
      ctrl.addEventListener('disconnected', () => { state.source = null; });

      ctrl.addEventListener('selectstart', () => {
        if (appState !== 'playing') return;
        const tempMat = new THREE.Matrix4().identity().extractRotation(ctrl.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMat);

        const tileHits = raycaster.intersectObjects(interactiveTiles, false);
        if (tileHits.length > 0 && trySlideTile(tileHits[0].object.userData.tileValue)) {
          pulseHaptic(state.source, 0.55, 32);
          return;
        }
        const btnHits = raycaster.intersectObjects(sideButtons.map(b => b.cap), false);
        if (btnHits.length > 0) {
          const b = sideButtons[btnHits[0].object.userData.sideBtnIdx];
          b.pressAnim = 1.0;
          b.action();
          pulseHaptic(state.source, 0.45, 28);
        }
      });

      ctrl.addEventListener('squeezestart', () => beginGrab(ctrl));
      ctrl.addEventListener('squeezeend', () => endGrab(ctrl));
      return state;
    });

    // --- Native Quest 3 Hand Tracking (Articulated Joints, Index Poke, Pinch-Ray & Pinch-Drag) ---
    const jointGeo = new THREE.SphereGeometry(0.0075, 8, 8);
    const jointMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.55, roughness: 0.3 });
    const tipRingGeo = new THREE.TorusGeometry(0.011, 0.002, 8, 16);

    const xrHands = [0, 1].map((i) => {
      const hand = renderer.xr.getHand(i);
      scene.add(hand);

      const jointMeshes = {};
      const indexRing = new THREE.Mesh(tipRingGeo, new THREE.MeshBasicMaterial({ color: 0xd4a853 }));
      const thumbRing = new THREE.Mesh(tipRingGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
      indexRing.visible = thumbRing.visible = false;
      scene.add(indexRing, thumbRing);

      const pinchAnchor = new THREE.Object3D();
      scene.add(pinchAnchor);

      const handRayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1.8)]);
      const handRay = new THREE.Line(handRayGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 }));
      handRay.visible = false;
      scene.add(handRay);

      return { hand, jointMeshes, indexRing, thumbRing, pinchAnchor, handRay, pinching: false, pokeCooldown: 0 };
    });

    const tmpVecA = new THREE.Vector3();
    const tmpVecB = new THREE.Vector3();
    const tmpLocal = new THREE.Vector3();

    function checkDirectPoke(worldPos, cooldownObj, hapticSource = null) {
      if (cooldownObj.pokeCooldown > 0 || appState !== 'playing') return;
      tmpLocal.copy(worldPos);
      boardRig.worldToLocal(tmpLocal);

      // Check tiles in board local space
      if (Math.abs(tmpLocal.z - (FRAME_D / 2 + 0.02)) < 0.032) {
        const cell = BOARD_INNER / gridSize;
        const c = Math.floor((tmpLocal.x + BOARD_INNER / 2) / cell);
        const r = Math.floor((GRID_Y_OFFSET + BOARD_INNER / 2 - tmpLocal.y) / cell);
        if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
          const val = board[r * gridSize + c];
          if (val !== 0 && trySlideTile(val)) {
            cooldownObj.pokeCooldown = 0.24;
            if (hapticSource) pulseHaptic(hapticSource, 0.5, 30);
            return;
          }
        }
      }

      // Check physical side buttons
      for (const b of sideButtons) {
        if (b.cooldown > 0) continue;
        b.cap.getWorldPosition(tmpVecB);
        if (worldPos.distanceTo(tmpVecB) < 0.032) {
          b.cooldown = 0.55;
          b.pressAnim = 1.0;
          b.action();
          cooldownObj.pokeCooldown = 0.35;
          if (hapticSource) pulseHaptic(hapticSource, 0.45, 28);
          return;
        }
      }
    }

    // --- XR Session Launchers ---
    const btnMR = document.getElementById('btn-enter-mr');
    const btnVR = document.getElementById('btn-enter-vr');

    async function setupXR() {
      if (!navigator.xr) return;
      const mrOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (mrOk) { btnMR.disabled = false; btnMR.onclick = () => triggerBootSequence('immersive-ar'); }
      if (vrOk) { btnVR.disabled = false; btnVR.onclick = () => triggerBootSequence('immersive-vr'); }
    }
    setupXR();

    async function startXR(mode) {
      const session = await navigator.xr.requestSession(mode, {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      });
      renderer.xr.setSession(session);
      const isMR = mode === 'immersive-ar';
      scene.background = isMR ? null : (currentTheme === 'vault' ? bgVault : bgWood);
      scene.fog = isMR ? null : new THREE.FogExp2(currentTheme === 'vault' ? 0x07090d : 0x120d0a, 0.09);
      envGroup.visible = !isMR;
      boardRig.position.set(0, 1.24, -0.58);
      boardRig.rotation.set(TILT_PRESETS[tiltIdx].rad, 0, 0);

      session.addEventListener('end', () => {
        scene.background = currentTheme === 'vault' ? bgVault : bgWood;
        scene.fog = new THREE.FogExp2(currentTheme === 'vault' ? 0x07090d : 0x120d0a, 0.09);
        envGroup.visible = true;
        boardRig.position.set(0, 1.24, -0.05);
        document.getElementById('hud').classList.add('visible');
        document.getElementById('hint').classList.add('visible');
      });
    }

    // =========================================================================
    // 9. UI WIRING
    // =========================================================================
    document.querySelectorAll('[data-theme]').forEach(btn => {
      btn.onclick = () => { initAudio(); playButtonSound(btn.dataset.theme); applyTheme(btn.dataset.theme); };
    });
    document.querySelectorAll('[data-size]').forEach(btn => {
      btn.onclick = () => { initAudio(); playButtonSound(currentTheme); setGridSize(Number(btn.dataset.size)); };
    });
    document.getElementById('btn-play-desktop').onclick = () => triggerBootSequence(null);
    document.getElementById('hud-intro').onclick = returnToIntro;
    document.getElementById('hud-shuffle').onclick = () => startNewShuffle(true);
    document.getElementById('hud-size').onclick = cycleGridSize;
    document.getElementById('hud-theme').onclick = toggleTheme;
    document.getElementById('hud-tilt').onclick = cycleTilt;
    document.getElementById('hud-mute').onclick = (e) => {
      muted = !muted;
      e.target.textContent = muted ? 'Sound: OFF' : 'Sound: ON';
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 10. INITIALIZE & MAIN LOOP
    // =========================================================================
    buildFrame();
    buildTiles(false);

    const clock = new THREE.Clock();
    let elapsed = 0;
    let demoSlideTimer = 0;
    let lastSecondTick = 0;

    renderer.setAnimationLoop(() => {
      const dt = Math.min(0.05, clock.getDelta());
      elapsed += dt;

      // Timer update
      if (timerRunning && !isSolved && appState === 'playing') {
        timerSec += dt;
        if (Math.floor(timerSec) !== lastSecondTick) {
          lastSecondTick = Math.floor(timerSec);
          updateDisplays();
        }
      }

      // Intro Showcase: Gentle 3D Orbit + Automated Demo Tile Slides
      if (appState === 'intro') {
        boardRig.rotation.y = Math.sin(elapsed * 0.45) * 0.34;
        boardRig.rotation.x = -0.18 + Math.cos(elapsed * 0.32) * 0.07;
        demoSlideTimer += dt;
        if (demoSlideTimer > 1.15) {
          demoSlideTimer = 0;
          const emptyIdx = board.indexOf(0);
          const er = Math.floor(emptyIdx / gridSize), ec = emptyIdx % gridSize;
          const adj = [];
          if (er > 0) adj.push(board[emptyIdx - gridSize]);
          if (er < gridSize - 1) adj.push(board[emptyIdx + gridSize]);
          if (ec > 0) adj.push(board[emptyIdx - 1]);
          if (ec < gridSize - 1) adj.push(board[emptyIdx + 1]);
          if (adj.length) trySlideTile(adj[Math.floor(Math.random() * adj.length)], true);
        }
      } else if (!grabState.active) {
        // Smooth glide to chosen tilt preset
        boardRig.rotation.x = THREE.MathUtils.lerp(boardRig.rotation.x, TILT_PRESETS[tiltIdx].rad, dt * 7);
        if (!renderer.xr.isPresenting) {
          boardRig.rotation.y = THREE.MathUtils.lerp(boardRig.rotation.y, 0, dt * 7);
        }
      }

      // Desktop Camera Orbit
      if (!renderer.xr.isPresenting) {
        const dist = 0.88;
        const target = boardRig.position;
        camera.position.x = target.x + Math.sin(orbitYaw) * Math.cos(orbitPitch) * dist;
        camera.position.y = target.y + Math.sin(orbitPitch) * dist + 0.04;
        camera.position.z = target.z + Math.cos(orbitYaw) * Math.cos(orbitPitch) * dist;
        camera.lookAt(target);
      }

      // Smooth Tile Sliding + Diagnostic LED Sweep
      Object.values(tileMeshes).forEach((tm) => {
        tm.group.position.lerp(tm.targetPos, Math.min(1, dt * 16));
        if (tm.sweepGlow > 0) {
          tm.sweepGlow -= dt;
          tm.pipMat.color.setHex(0x38bdf8);
          if (tm.sweepGlow <= 0) refreshPipStates();
        }
      });

      // Side Button Spring Animation
      sideButtons.forEach((b) => {
        if (b.cooldown > 0) b.cooldown -= dt;
        if (b.pressAnim > 0) {
          b.pressAnim = Math.max(0, b.pressAnim - dt * 5);
          b.cap.position.x = -b.pressAnim * 0.008;
        }
      });

      // XR Grab Repositioning
      if (grabState.active && grabState.grabber) {
        const targetMat = new THREE.Matrix4().multiplyMatrices(grabState.grabber.matrixWorld, grabState.offsetMatrix);
        targetMat.decompose(boardRig.position, boardRig.quaternion, tmpVecA);
      }

      // XR Controller Direct Poke
      if (renderer.xr.isPresenting) {
        xrControllers.forEach((c) => {
          if (c.pokeCooldown > 0) c.pokeCooldown -= dt;
          c.tip.getWorldPosition(tmpVecA);
          checkDirectPoke(tmpVecA, c, c.source);
        });

        // XR Native Hand Tracking Update
        xrHands.forEach((h) => {
          if (h.pokeCooldown > 0) h.pokeCooldown -= dt;
          const joints = h.hand.joints;
          const idxTip = joints && joints['index-finger-tip'];
          const thmTip = joints && joints['thumb-tip'];
          const wrist = joints && joints['wrist'];

          if (!idxTip || !thmTip || !idxTip.visible) {
            h.indexRing.visible = h.thumbRing.visible = h.handRay.visible = false;
            return;
          }

          // Render sleek joint spheres
          for (const jName in joints) {
            const j = joints[jName];
            if (!j.visible) continue;
            if (!h.jointMeshes[jName]) {
              const m = new THREE.Mesh(jointGeo, jointMat);
              scene.add(m);
              h.jointMeshes[jName] = m;
            }
            h.jointMeshes[jName].position.copy(j.position);
          }

          h.indexRing.visible = h.thumbRing.visible = true;
          h.indexRing.position.copy(idxTip.position);
          h.indexRing.quaternion.copy(idxTip.quaternion);
          h.thumbRing.position.copy(thmTip.position);
          h.thumbRing.quaternion.copy(thmTip.quaternion);

          // Direct Index-Finger Poke
          checkDirectPoke(idxTip.position, h, null);

          // Seated Pinch-Ray & Pinch-Drag Repositioning
          const pinchDist = idxTip.position.distanceTo(thmTip.position);
          if (wrist && wrist.visible) {
            h.handRay.visible = true;
            tmpVecA.subVectors(idxTip.position, wrist.position).normalize();
            h.handRay.position.copy(idxTip.position);
            h.handRay.lookAt(tmpVecB.copy(idxTip.position).add(tmpVecA));
            h.handRay.rotateY(Math.PI);
          }

          if (pinchDist < 0.022 && !h.pinching) {
            h.pinching = true;
            h.pinchAnchor.position.copy(idxTip.position);
            h.pinchAnchor.quaternion.copy(idxTip.quaternion);
            h.pinchAnchor.updateMatrixWorld(true);

            // Raycast from hand to click a tile/button; otherwise grab the board
            raycaster.ray.origin.copy(idxTip.position);
            raycaster.ray.direction.copy(tmpVecA);
            const tHits = raycaster.intersectObjects(interactiveTiles, false);
            if (tHits.length > 0 && trySlideTile(tHits[0].object.userData.tileValue)) {
              // Slid via pinch-ray
            } else {
              const bHits = raycaster.intersectObjects(sideButtons.map(b => b.cap), false);
              if (bHits.length > 0) {
                const b = sideButtons[bHits[0].object.userData.sideBtnIdx];
                b.pressAnim = 1.0;
                b.action();
              } else {
                beginGrab(h.pinchAnchor);
              }
            }
          } else if (pinchDist < 0.032 && h.pinching) {
            h.pinchAnchor.position.copy(idxTip.position);
            h.pinchAnchor.quaternion.copy(idxTip.quaternion);
            h.pinchAnchor.updateMatrixWorld(true);
          } else if (pinchDist >= 0.032 && h.pinching) {
            h.pinching = false;
            endGrab(h.pinchAnchor);
          }
        });
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
